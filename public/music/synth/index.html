    <style>
      /* Stopgap for a layout bug in the compiled bundle: .sa-main is meant to
         be the app's scrollable region (overflow:auto) but its parent chain
         never constrains its height, so it grows to fit all content instead
         of scrolling — the sequencer panel ends up ~2500px down, past the
         viewport-clipped html/body (overflow:hidden), completely unreachable.
         Confirmed live: this forces the intended height chain and brings the
         sequencer's own "Close sequencer" button back on-screen. The real fix
         belongs in the Stave source (a missing height/min-height link between
         .sa-app and .sa-main) — remove this once that ships and this file is
         regenerated from a fresh build.

         The page is also viewport-clipped (html/body overflow:hidden), so the
         shared nav's height has to come OFF the app's, per the layout contract
         in /shared/site-nav.css — at a flat 100% the app would sit one bar
         taller than the window and lose its bottom row off the clipped edge. */
      /* min-height must be cleared too — the bundle pins it to the full
         viewport, which outranks a shorter height and pushes the app back
         down past the clipped edge. */
      .sa-app, .sa-app--sy1 {
        height: calc(100% - var(--pm-nav-h)) !important;
        min-height: 0 !important;
      }
      .sa-main { height: 100% !important; min-height: 0 !important; }
    </style>
    <link rel="stylesheet" href="/shared/site-nav.css" />
  </head>

    <script src="/shared/site-nav.js"></script>
    <div id="root"></div>
    <script src="/music/shared/keyboard-performance.js"></script>
  </body>
