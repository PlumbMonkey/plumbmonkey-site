name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js exports
        run: npm run build

      - name: Copy Next.js exports to root
        run: |
          cp -r out/_next ./ || true
          cp -r out/onboarding/orientation.html onboarding/orientation.html || true
          cp -r out/onboarding/orientation.txt onboarding/orientation.txt || true
          cp -r out/arcade ./ || true
          cp -r out/arcade.html ./arcade.html || true
          cp -r out/arcade.txt ./arcade.txt || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and build
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install and build
        run: npm ci && npm run build

      - name: Copy exports
        run: |
          cp -r out/_next ./ || true
          cp -r out/onboarding/orientation.html onboarding/orientation.html || true
          cp -r out/onboarding/orientation.txt onboarding/orientation.txt || true
          cp -r out/arcade ./ || true
          cp -r out/arcade.html ./arcade.html || true
          cp -r out/arcade.txt ./arcade.txt || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
