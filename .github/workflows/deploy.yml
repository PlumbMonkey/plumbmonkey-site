name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # *.mp4 is LFS-tracked (.gitattributes). Without this, checkout leaves
          # every video as a ~130-byte pointer file, `next build` copies those
          # pointers into ./out, and the deployed site serves them as MP4s — so
          # the <source type="video/mp4"> fallbacks silently fail for anyone
          # whose browser cannot take the WebM listed ahead of them.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install and build
        run: npm ci && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
